# invalidPassword* messages go through MessageFormat, so apostrophes are doubled.
# The Admin Console shows passwordPoliciesHelp.* as-is, so apostrophes are single.
invalidPasswordBreachedMessage=This password isn''t safe to use. It was found in a publicly available list of leaked passwords. This doesn''t mean your account has been compromised, but please choose a different password to stay protected.
passwordPoliciesHelp.hibp=Rejects passwords found in the Have I Been Pwned breached-password list. Only the first 5 characters of the password's SHA-1 hash are sent. If the service can't be reached, the password is accepted.
